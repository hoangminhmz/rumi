<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f3f4f6"/>

  <!-- Simple house icon -->
  <g transform="translate(400, 300)">
    <!-- House body -->
    <rect x="-120" y="-50" width="240" height="180" fill="#d1d5db" stroke="#9ca3af" stroke-width="3"/>

    <!-- Roof -->
    <path d="M -150 -50 L 0 -150 L 150 -50 Z" fill="#9ca3af" stroke="#6b7280" stroke-width="3"/>

    <!-- Door -->
    <rect x="-30" y="50" width="60" height="80" fill="#6b7280" rx="5"/>
    <circle cx="15" cy="90" r="5" fill="#f3f4f6"/>

    <!-- Windows -->
    <rect x="-100" y="-20" width="50" height="50" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <line x1="-75" y1="-20" x2="-75" y2="30" stroke="#9ca3af" stroke-width="2"/>
    <line x1="-100" y1="5" x2="-50" y2="5" stroke="#9ca3af" stroke-width="2"/>

    <rect x="50" y="-20" width="50" height="50" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <line x1="75" y1="-20" x2="75" y2="30" stroke="#9ca3af" stroke-width="2"/>
    <line x1="50" y1="5" x2="100" y2="5" stroke="#9ca3af" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="24" fill="#6b7280" text-anchor="middle">No Room Image</text>
</svg>
